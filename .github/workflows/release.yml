# Builds the launcher app when a version tag such as v1.0.0 is pushed, and attaches it to a
# GitHub release. The build does not need Logic Pro, because the theme reads the Logic Pro
# color list on the Mac of the user.
name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Test
        run: tests/run.sh
      - name: Build
        run: VERSION="${GITHUB_REF_NAME#v}" app/build.sh
      - name: Package
        run: ditto -c -k --keepParent "app/I See Logic Pro.app" "ISeeLogicPro-${GITHUB_REF_NAME#v}.zip"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "ISeeLogicPro-${GITHUB_REF_NAME#v}.zip" \
            --title "I See Logic Pro ${GITHUB_REF_NAME#v}" \
            --notes "For Logic Pro 13.0 (build 7801) on macOS 26 and Apple silicon. Apple did not notarize this app. See \"Install\" in the README for the steps to open it the first time."

  # Writes the new version and checksum into the cask of the Homebrew tap. It is a separate job,
  # so you can run it again alone if it fails. A pre-release tag such as v1.5.0-beta.1 does not
  # change the cask. The secret TAP_TOKEN is a fine-grained token with write access to the
  # contents of karlingen/homebrew-tap.
  homebrew:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Update the Homebrew cask
        # The bash shell of GitHub Actions stops at the first failed command, also in a pipe.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo 'The secret TAP_TOKEN is not set.' >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          zip="ISeeLogicPro-$version.zip"
          cask=Casks/i-see-logic-pro.rb
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "$zip"
          sha=$(shasum -a 256 "$zip" | cut -d ' ' -f 1)
          git clone "https://x-access-token:$TAP_TOKEN@github.com/karlingen/homebrew-tap.git" tap
          cd tap
          sed -i.bak -e "s/^  version \".*\"$/  version \"$version\"/" \
             -e "s/^  sha256 \".*\"$/  sha256 \"$sha\"/" "$cask"
          rm "$cask.bak"
          if ! grep -qxF "  version \"$version\"" "$cask" || ! grep -qxF "  sha256 \"$sha\"" "$cask"; then
            echo "The version or the sha256 line of $cask has an unknown format." >&2
            exit 1
          fi
          if git diff --quiet; then
            echo "The cask already has version $version."
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
             -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
             commit -am "chore: Update i-see-logic-pro to $version"
          git push

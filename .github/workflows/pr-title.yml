# Fails a pull request whose title does not follow Conventional Commits, for example
# "fix: Keep the track name readable". A squash merge uses the title as the commit subject.
# The job does not check out the code of the pull request, so pull_request_target is safe here.
name: PR title

on:
  pull_request_target:
    types: [ opened, edited, reopened, synchronize ]

permissions:
  pull-requests: read

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      # v6.1.2
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            config
            revert
